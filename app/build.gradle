apply plugin: 'com.android.application'

if (rootProject.file('signing.properties').exists()) {
    apply from: '../signing.gradle'
}

android {
    namespace 'me.zhanghai.android.douya'
    buildFeatures { buildConfig true }

    compileSdk 34

    defaultConfig {
        applicationId 'me.zhanghai.android.douya'
        minSdk 16
        targetSdk 34
        versionCode 14
        versionName '1.0.0-beta.11'
        resValue 'string', 'application_id', applicationId
        buildConfigField 'String', 'FILE_PROVIDIER_AUTHORITY', 'APPLICATION_ID + ".file_provider"'
        resValue 'string', 'file_provider_authority', applicationId + '.file_provider'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        debug {
            ext.enableCrashlytics = false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName('release') != null) signingConfig signingConfigs.release
        }
    }
}

repositories {
    maven {
        url rootProject.file('local-maven')
        content {
            includeGroup 'com.google.android.exoplayer'
            includeGroup 'com.takisoft.fix'
            includeModule 'pub.devrel', 'easypermissions'
        }
    }
    maven {
        url 'https://jitpack.io'
    }
}
dependencies {
    releaseImplementation 'com.github.mypplication:stetho-noop:1.1'
    implementation 'com.github.chrisbanes:PhotoView:2.1.3'
    implementation 'com.github.XhinLiang:LunarCalendar:3.0.0'
}

dependencies {
    implementation('com.crashlytics.sdk.android:answers:1.4.1@aar') {
        transitive = true
    }
    implementation('com.crashlytics.sdk.android:crashlytics:2.9.1@aar') {
        transitive = true
    }
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.browser:browser:1.0.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    // For SubsamplingScaleImageView
    implementation 'androidx.exifinterface:exifinterface:1.0.0'

    implementation 'com.andkulikov:transitionseverywhere:1.7.9'
    debugImplementation 'com.facebook.stetho:stetho:1.5.0'
    debugImplementation 'com.facebook.stetho:stetho-okhttp3:1.5.0'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view:3.10.0'
    // Glide 4.2.0 introduced lag/white on long images and white flash in transition for us.
    annotationProcessor 'com.github.bumptech.glide:compiler:4.1.1'
    implementation 'com.github.bumptech.glide:glide:4.1.1'
    // Workaround https://github.com/google/ExoPlayer/issues/4234
    implementation ('com.google.android.exoplayer:exoplayer-core:2.8.0') {
        exclude group: 'org.checkerframework', module: 'checker-qual'
    }
    implementation ('com.google.android.exoplayer:extension-mediasession:2.8.0') {
        exclude group: 'org.checkerframework', module: 'checker-qual'
    }
    implementation ('com.google.android.exoplayer:extension-okhttp:2.8.0') {
        exclude group: 'org.checkerframework', module: 'checker-qual'
    }
    implementation 'com.google.code.gson:gson:2.8.2'
    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    implementation 'com.jakewharton:disklrucache:2.0.2'
    implementation 'com.jakewharton.scalpel:scalpel:1.1.2'
    implementation 'com.jakewharton.threetenabp:threetenabp:1.0.5'
    implementation 'com.squareup.retrofit2:converter-gson:2.4.0'
    implementation 'com.squareup.retrofit2:retrofit:2.4.0'
    implementation 'com.takisoft.fix:preference-v7:27.1.1.1'
    implementation 'com.takisoft.fix:preference-v7-simplemenu:27.1.1.1'
    implementation 'org.greenrobot:eventbus:3.1.1'
    implementation 'de.hdodenhof:circleimageview:2.2.0'
    implementation 'de.psdev.licensesdialog:licensesdialog:1.8.3'
    implementation 'me.zhanghai.android.customtabshelper:library:1.0.4'
    implementation 'me.zhanghai.android.effortlesspermissions:library:1.0.3'
    implementation 'me.zhanghai.android.materialedittext:library:1.0.5'
    implementation 'me.zhanghai.android.materialprogressbar:library:1.4.2'
    implementation 'me.zhanghai.android.materialratingbar:library:1.1.1'
    implementation 'me.zhanghai.android.systemuihelper:library:1.0.0'
}

